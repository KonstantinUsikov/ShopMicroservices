services:
  catalogdb:
    image: postgres
    container_name: catalogdb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=CatalogDb
    restart: always
    ports:
      - "15432:5432"
    volumes:
      - postgres_catalog:/var/lib/postgresql/
  
  basketdb:
    image: postgres
    container_name: basketdb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=BasketDb
    restart: always
    ports:
      - "15433:5432"
    volumes:
      - postgres_basket:/var/lib/postgresql/
  
  distributedcache:
    image: redis
    container_name: distributedcache
    restart: always
    ports:
      - "16379:6379"
  
  orderdb:
    image: mcr.microsoft.com/mssql/server
    container_name: orderdb
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=SwN12345678
    restart: always
    ports:
      - "11433:1433"
  
  messagebroker:
    image: rabbitmq:management
    container_name: messagebroker
    hostname: ecommerce-mq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
  
  catalog.api:
    image: catalog.api
    build:
      context: .
      dockerfile: Services/Catalog/Catalog.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__Database=Server=catalogdb;Port=5432;Database=CatalogDb;User Id=postgres;Password=postgres;Include Error Detail=true
      - ASPNETCORE_Kestrel__Endpoints__Http__Url=http://0.0.0.0:8080
      - ASPNETCORE_Kestrel__Endpoints__Https__Url=https://0.0.0.0:8081
      - ASPNETCORE_Kestrel__Endpoints__Https__Certificate__Path=/home/app/.aspnet/https/cert.pfx
      - ASPNETCORE_Kestrel__Endpoints__Https__Certificate__Password=mypassword
    depends_on:
      - catalogdb
    ports:
      - "6000:8080"
      - "6060:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
  
  basket.api:
    image: basket.api
    build:
      context: .
      dockerfile: Services/Basket/Basket.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__Database=Server=basketdb;Port=5432;Database=BasketDb;User Id=postgres;Password=postgres;Include Error Detail=true
      - ConnectionStrings__Redis=distributedcache:6379
      - GrpcSettings__DiscountUrl=https://discount.grpc:8081
      - ASPNETCORE_Kestrel__Endpoints__Http__Url=http://0.0.0.0:8080
      - ASPNETCORE_Kestrel__Endpoints__Https__Url=https://0.0.0.0:8081
      - ASPNETCORE_Kestrel__Endpoints__Https__Certificate__Path=/home/app/.aspnet/https/cert.pfx
      - ASPNETCORE_Kestrel__Endpoints__Https__Certificate__Password=mypassword
      - MessageBroker__Host=amqp://ecommerce-mq:5672
      - MessageBroker__UserName=guest
      - MessageBroker__Password=guest
    depends_on:
      - basketdb
      - distributedcache
      - discount.grpc
      - messagebroker
    ports:
      - "6001:8080"
      - "6061:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
  
  discount.grpc:
    image: discount.grpc
    build:
      context: .
      dockerfile: Services/Discount/Discount.Grpc/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__Database=Data Source=discountdb
      - ASPNETCORE_Kestrel__Endpoints__Http__Url=http://0.0.0.0:8080
      - ASPNETCORE_Kestrel__Endpoints__Https__Url=https://0.0.0.0:8081
      - ASPNETCORE_Kestrel__Endpoints__Https__Certificate__Path=/home/app/.aspnet/https/cert.pfx
      - ASPNETCORE_Kestrel__Endpoints__Https__Certificate__Password=mypassword
    ports:
      - "6002:8080"
      - "6062:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
  
  ordering.api:
    image: ordering.api
    build:
      context: .
      dockerfile: Services/Ordering/Ordering.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__Database=Server=orderdb,1433;Database=OrderDb;User Id=sa;Password=SwN12345678;Encrypt=False;TrustServerCertificate=True
      - ASPNETCORE_Kestrel__Endpoints__Http__Url=http://0.0.0.0:8080
      - ASPNETCORE_Kestrel__Endpoints__Https__Url=https://0.0.0.0:8081
      - ASPNETCORE_Kestrel__Endpoints__Https__Certificate__Path=/home/app/.aspnet/https/cert.pfx
      - ASPNETCORE_Kestrel__Endpoints__Https__Certificate__Password=mypassword
      - MessageBroker__Host=amqp://ecommerce-mq:5672
      - MessageBroker__UserName=guest
      - MessageBroker__Password=guest
      - FeatureManagement__OrderFulfillment=false
    depends_on:
      - orderdb
      - messagebroker
    ports:
      - "6003:8080"
      - "6063:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
        
  yarpapigateway:
    image: yarpapigateway
    build:
      context: .
      dockerfile: ApiGateways/YarpApiGateway/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ASPNETCORE_Kestrel__Endpoints__Http__Url=http://0.0.0.0:8080
      - ASPNETCORE_Kestrel__Endpoints__Https__Url=https://0.0.0.0:8081
      - ASPNETCORE_Kestrel__Endpoints__Https__Certificate__Path=/home/app/.aspnet/https/cert.pfx
      - ASPNETCORE_Kestrel__Endpoints__Https__Certificate__Password=mypassword
    depends_on:
      - catalog.api
      - basket.api
      - ordering.api
    ports:
      - "6004:8080"
      - "6064:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
    
volumes:
  postgres_catalog:
  postgres_basket:
